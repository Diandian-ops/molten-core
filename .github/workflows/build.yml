name: Build & Release

# 触发：推送到 main 会自动构建并发布（continuous 预发布）；打 v* tag 发正式版；也可手动触发。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 用于创建/更新 Release
  issues: write   # 失败时自动开诊断 Issue（公开可读，绕过日志 403）

env:
  GODOT_VERSION: "4.7.1-stable"

jobs:
  build:
    name: Smoke test + Export (Win/macOS/Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Godot 4 无头运行需要的系统库（headless 仍链接部分 X11/音频库）
      - name: Install Godot runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxinerama1 libgl1 libglu1-mesa \
            libasound2 libpulse0 libfontconfig1 libssl3 libuuid1 unzip

      - name: Download Godot editor (Linux)
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -o godot.zip
          mv "Godot_v${{ env.GODOT_VERSION }}_linux.x86_64" godot
          chmod +x godot

      - name: Download & extract export templates
        # Godot 4.7 没有 --install-templates CLI；模板 tpz 本质是个 zip，内含 templates/ 目录。
        # Godot 按完整版本名 4.7.1.stable.official.a13da4feb 找模板目录，直接解压到该目录即可
        # （空 custom_template 也能命中，无需在 export_presets.cfg 写绝对路径）。
        run: |
          curl -fL -o export_templates.tpz "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz"
          # 注意：Godot 按完整版本名(点号)找模板目录 4.7.1.stable.official.a13da4feb，
          # 不能用 GODOT_VERSION 的连字符版 4.7.1-stable，否则模板放错目录导致所有平台导出失败。
          TD="$HOME/.local/share/godot/export_templates/4.7.1.stable.official.a13da4feb"
          mkdir -p "$TD"
          rm -rf tmpl_tmp && unzip -o -q export_templates.tpz -d tmpl_tmp
          cp -r tmpl_tmp/templates/. "$TD"/
          rm -rf tmpl_tmp
          echo "templates ready at $TD"; ls "$TD" | head

      # ── Android 源模板（gradle 导出必需；CI 原缺失 → Android 导出失败）──
      # Godot 4.7 发布资产命名为 Godot_v<ver>_android_source.perfetto.zip，
      # 但 Godot 内部查找 android_source.zip（及 possibly .perfetto.zip），两份都放以覆盖。
      - name: Download Android source template
        run: |
          curl -fL -o android_src.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_android_source.perfetto.zip"
          cp android_src.zip "$TD/android_source.zip"
          cp android_src.zip "$TD/android_source.perfetto.zip"
          echo "android source template placed:"; ls -la "$TD" | grep -i android

      # ── 冒烟测试：临时把 main_scene 指向测试场景，无头跑一遍，校验 SMOKE_TEST_OK ──
      - name: Run gameplay smoke test
        run: |
          python3 - <<'PY'
          import re
          p = "project.godot"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'run/main_scene="[^"]*"', 'run/main_scene="res://scenes/test/smoke_test.tscn"', s)
          open(p, "w", encoding="utf-8").write(s)
          print("patched main_scene -> smoke_test")
          PY
          ./godot --headless --path . 2>&1 | tee smoke.log
          grep -q "SMOKE_TEST_OK" smoke.log || { echo "::error::SMOKE TEST FAILED"; exit 1; }
          echo "SMOKE TEST PASSED"

      - name: Restore project.godot
        if: always()
        run: git checkout -- project.godot

      # ── Android 导出依赖：Gradle 构建需要 JDK 17 + Android SDK ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools + platform + build-tools)
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

      # ── 导出平台（preset 名须与 export_presets.cfg 完全一致）──
      # Android 首次导出时 Godot 会自动下载 Gradle 分发，需联网。
      # Win/macOS 用 continue-on-error：任一失败不阻塞 Android（我们要的是 Android 包）。
      # Android 不加 continue-on-error：它失败才让 job 失败 → 触发诊断 Issue。
      - name: Export Windows
        continue-on-error: true
        run: ./godot --headless --path . --export-release "Windows Desktop"

      - name: Export macOS
        continue-on-error: true
        run: ./godot --headless --path . --export-release "macOS"

      - name: Export Android
        run: ./godot --headless --path . --export-release "Android"

      # ── 打包成 zip 产物（各平台独立，缺失则跳过；Android 是我们主要目标）──
      - name: Package artifacts
        if: always()
        run: |
          mkdir -p dist
          ( cd build/windows && [ -f MoltenCore.exe ] && zip -r ../../dist/MoltenCore-windows.zip MoltenCore.exe || echo "skip windows" )
          ( cd build/macos   && [ -d MoltenCore.app ] && zip -r ../../dist/MoltenCore-macos.zip MoltenCore.app || echo "skip macos" )
          ( cd build/android && [ -f MoltenCore.apk ] && zip -r ../../dist/MoltenCore-android.zip MoltenCore.apk || echo "skip android" )
          echo "--- dist ---"; ls -la dist

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moltencore-builds
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14

      # ── 失败自诊断：把失败 step + 错误片段发成公开 Issue，绕过日志 403 不可读 ──
      - name: Diagnose failure → open issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, zipfile, re, os
          token = os.environ['GH_TOKEN']; repo = os.environ['REPO']; run_id = os.environ['RUN_ID']
          H = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
          def api(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H)))
          jobs = api('https://api.github.com/repos/%s/actions/runs/%s/jobs?per_page=20' % (repo, run_id))
          failed = [(j['name'], s['name']) for j in jobs.get('jobs', []) for s in j.get('steps', []) if s.get('conclusion') == 'failure']
          err = ''
          try:
              req = urllib.request.Request('https://api.github.com/repos/%s/actions/runs/%s/logs' % (repo, run_id), headers=H)
              zp = '/tmp/ci_logs_%s.zip' % run_id
              open(zp, 'wb').write(urllib.request.urlopen(req).read())
              z = zipfile.ZipFile(zp)
              for n in z.namelist():
                  for ln in z.read(n).decode('utf-8', 'ignore').splitlines():
                      if re.search(r'error|exception|fail|cannot|not found|no such|traceback|refused', ln, re.I):
                          err += ln + '\n'
          except Exception as e:
              err = 'log fetch error: ' + str(e)
          body = '## CI Failure Auto-Diagnosis\n\nFailed steps:\n'
          for j, s in failed:
              body += '- [%s] %s\n' % (j, s)
          body += '\n### Error snippets (first 4000 chars)\n```\n' + err[:4000] + '\n```\n'
          body += '\nrun_id=%s' % run_id
          try:
              urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/%s/issues' % repo,
                  data=json.dumps({'title': 'CI diagnosis run %s' % run_id, 'body': body}).encode(), headers=H, method='POST'))
              print('ISSUE_CREATED')
          except Exception as e:
              print('ISSUE_CREATE_FAILED', e)
          PY

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: moltencore-builds
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          name: MoltenCore ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
